[project]
name = "SCPYTSDK"
description = "Super Cool Python SDK for Turso Platform API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FrancyAngy", email = "francesco@scsdc-co.org" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.34.2"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/SCSDC-co/SCPYTSDK"
Repository = "https://github.com/SCSDC-co/SCPYTSDK.git"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.isort]
multi_line_output = 3
line_length = 100

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]
